<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Zajęć - SQLite & E2EE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // KONFIGURACJA BAZY SQLITE (TURSO)
    // =========================================================================
    const TURSO_DB_URL = "https://plan-cyber-mmyrlak.aws-eu-central-1.turso.io";
    const TURSO_AUTH_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJleHAiOjE4MDE5MTk1NTAsImlhdCI6MTc5NDE0MzU1MCwiaWQiOiIwMWExYmI0Ny0yZTAxLTcwM2YtOGRlMC0wMzJiNDM4MjMwNzkiLCJraWQiOiJjTm1nSE1lWks0UWhDV1k2YkRVajNZV2JhaFhBRGdUcGZwZWRJUkVfcEdvIiwicmlkIjoiNzgwNDEzYmYtYjBhYy00N2MzLTk2ZDgtMTU4MzMwMTUzNTdlIn0.BiM7-bZWSNckHMqr2H1STsSjSg7x5Z04pbChKL3HPR924KvyUKqUJx4iRxKI2AMnM4l4aWXQkWD-Bps-dCykAA";

    // =========================================================================
    // HELPERY SORTOWANIA KALENDARZOWEGO
    // =========================================================================
    function parseDateToAcademicOrder(dateStr) {
      if (!dateStr) return 999999;
      const clean = dateStr.trim().split("-")[0];
      const parts = clean.split(".");
      if (parts.length < 2) return 999999;

      const day = parseInt(parts[0], 10) || 0;
      const month = parseInt(parts[1], 10) || 0;

      const academicYearOffset = month >= 9 ? 0 : 1;
      return academicYearOffset * 10000 + month * 100 + day;
    }

    const DAY_ORDER = {
      "Poniedziałek": 1,
      "Wtorek": 2,
      "Środa": 3,
      "Czwartek": 4,
      "Piątek": 5,
      "Sobota": 6,
      "Niedziela": 7
    };

    // =========================================================================
    // SZYFROWANIE E2EE (AES-256-GCM + PBKDF2)
    // =========================================================================
    async function deriveKey(passphrase) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: enc.encode("cyber_polsl_salt_2026"),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(dataObj, key) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(JSON.stringify(dataObj));
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);

      const combined = new Uint8Array(iv.length + ciphertext.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(ciphertext), iv.length);
      return btoa(String.fromCharCode.apply(null, combined));
    }

    async function decryptPayload(cipherB64, key) {
      try {
        const binStr = atob(cipherB64);
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

        const iv = bytes.slice(0, 12);
        const ciphertext = bytes.slice(12);

        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
        return JSON.parse(new TextDecoder().decode(decrypted));
      } catch (err) {
        throw new Error("Błędne hasło grupy lub uszkodzone dane");
      }
    }

    // =========================================================================
    // API KLIENTA SQLITE (TURSO HTTP PIPELINE)
    // =========================================================================
    async function queryTurso(statements) {
      const url = `${TURSO_DB_URL}/v2/pipeline`;
      const requests = statements.map(st => ({
        type: "execute",
        stmt: typeof st === "string" ? { sql: st } : st
      }));

      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${TURSO_AUTH_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ requests })
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Błąd Turso HTTP (${res.status}): ${txt}`);
      }
      const json = await res.json();
      return json.results;
    }

    // =========================================================================
    // ŁADNA NAZWA GRUPY (kosmetyka nagłówka)
    // =========================================================================
    const groupTitle = (g) => {
      if (!g) return "Plan Zajęć";
      if (g === "cyber") return "s2_IP 3Z/1 Cyberbezpieczeństwo";
      if (g === "pk") return "s2_IP 3Z/1 PK";
      return `Plan Zajęć – ${g}`;
    };

    // =========================================================================
    // GŁÓWNA APLIKACJA REACT
    // =========================================================================
    function App() {
      const [password, setPassword] = useState(sessionStorage.getItem("cyber_plan_pass") || "");
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [cryptoKey, setCryptoKey] = useState(null);

      // Grupa rozpoznana dynamicznie z odszyfrowanych danych
      const [currentGroup, setCurrentGroup] = useState(sessionStorage.getItem("cyber_plan_group") || "");

      const [schedule, setSchedule] = useState([]);
      const [selectedWeek, setSelectedWeek] = useState("");
      const [modalClass, setModalClass] = useState(null);
      const [isNewClass, setIsNewClass] = useState(false);
      const [loading, setLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState("");

      // -----------------------------------------------------------------------
      // ODBLOKOWANIE + POBIERANIE (try-decrypt: grupa wyznaczana przez klucz)
      // -----------------------------------------------------------------------
      const unlockAndFetch = async (pass) => {
        if (!pass) return;
        setLoading(true);
        setStatusMsg("Weryfikacja hasła i pobieranie z SQLite...");
        try {
          const key = await deriveKey(pass);

          const results = await queryTurso([
            "SELECT id, week_range, day_name, day_date, time, type, enc_payload, group_name FROM classes;"
          ]);
          const rows = results[0]?.response?.result?.rows || [];

          const decrypted = [];
          let detectedGroup = null;

          for (const r of rows) {
            try {
              const payload = await decryptPayload(r[6].value, key);
              const rowGroup = r[7].value || "";

              // Spójność: wszystkie odszyfrowane wiersze muszą być tej samej grupy
              if (detectedGroup !== null && detectedGroup !== rowGroup) continue;
              detectedGroup = rowGroup;

              decrypted.push({
                id: r[0].value,
                weekRange: r[1].value,
                dayName: r[2].value,
                date: r[3].value,
                time: r[4].value,
                type: r[5].value,
                title: payload.title,
                room: payload.room,
                teacher: payload.teacher,
                notes: payload.notes,
                meetingLink: payload.meetingLink || "",
                groupName: rowGroup
              });
            } catch {
              // ten wiersz nie należy do użytkownika – pomijamy
            }
          }

          if (decrypted.length === 0) {
            throw new Error(
              "Nieprawidłowe hasło – nie udało się odszyfrować żadnego wpisu.\n\n" +
              "Jeśli Twoja grupa nie ma jeszcze żadnych zajęć, poproś administratora " +
              "o dodanie pierwszego wpisu do bazy."
            );
          }

          setCryptoKey(key);
          sessionStorage.setItem("cyber_plan_pass", pass);
          sessionStorage.setItem("cyber_plan_group", detectedGroup);
          setCurrentGroup(detectedGroup);
          setSchedule(decrypted);
          setIsUnlocked(true);
          setStatusMsg("");
        } catch (err) {
          console.error(err);
          alert(err.message);
          setStatusMsg("");
        } finally {
          setLoading(false);
        }
      };

      // -----------------------------------------------------------------------
      // SORTOWANIE TYGODNI
      // -----------------------------------------------------------------------
      const sortedWeeks = useMemo(() => {
        const unique = [...new Set(schedule.map(c => c.weekRange).filter(Boolean))];
        return unique.sort((a, b) => parseDateToAcademicOrder(a) - parseDateToAcademicOrder(b));
      }, [schedule]);

      useEffect(() => {
        if (sortedWeeks.length > 0 && (!selectedWeek || !sortedWeeks.includes(selectedWeek))) {
          setSelectedWeek(sortedWeeks[0]);
        }
      }, [sortedWeeks, selectedWeek]);

      // -----------------------------------------------------------------------
      // ZAPIS (INSERT / UPDATE) – group_name automatycznie z aktywnej grupy
      // -----------------------------------------------------------------------
      const handleSave = async (e) => {
        e.preventDefault();
        if (!currentGroup) {
          alert("Brak aktywnej grupy – zaloguj się ponownie.");
          return;
        }
        setLoading(true);
        setStatusMsg("Szyfrowanie i zapis w SQLite...");
        try {
          const enc = await encryptPayload({
            title: modalClass.title,
            room: modalClass.room,
            teacher: modalClass.teacher,
            notes: modalClass.notes || "",
            meetingLink: modalClass.meetingLink ? modalClass.meetingLink.trim() : ""
          }, cryptoKey);

          if (isNewClass) {
            await queryTurso([{
              sql: "INSERT INTO classes (id, week_range, day_name, day_date, time, type, enc_payload, group_name, updated_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, CURRENT_TIMESTAMP)",
              args: [
                { type: "text", value: modalClass.id },
                { type: "text", value: modalClass.weekRange },
                { type: "text", value: modalClass.dayName },
                { type: "text", value: modalClass.date },
                { type: "text", value: modalClass.time },
                { type: "text", value: modalClass.type },
                { type: "text", value: enc },
                { type: "text", value: currentGroup }
              ]
            }]);
            setSchedule(prev => [...prev, { ...modalClass, groupName: currentGroup }]);
            setSelectedWeek(modalClass.weekRange);
          } else {
            await queryTurso([{
              sql: "UPDATE classes SET week_range = ?, day_name = ?, day_date = ?, time = ?, type = ?, enc_payload = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ? AND group_name = ?",
              args: [
                { type: "text", value: modalClass.weekRange },
                { type: "text", value: modalClass.dayName },
                { type: "text", value: modalClass.date },
                { type: "text", value: modalClass.time },
                { type: "text", value: modalClass.type },
                { type: "text", value: enc },
                { type: "text", value: modalClass.id },
                { type: "text", value: currentGroup }
              ]
            }]);
            setSchedule(prev => prev.map(c => c.id === modalClass.id ? { ...modalClass, groupName: currentGroup } : c));
          }

          setModalClass(null);
        } catch (err) {
          alert("Błąd zapisu do bazy: " + err.message);
        } finally {
          setLoading(false);
          setStatusMsg("");
        }
      };

      // -----------------------------------------------------------------------
      // USUWANIE – z dodatkowym warunkiem grupy
      // -----------------------------------------------------------------------
      const handleDelete = async (classId) => {
        if (!confirm("Czy na pewno chcesz usunąć te zajęcia z bazy SQLite?")) return;
        setLoading(true);
        setStatusMsg("Usuwanie z SQLite...");
        try {
          await queryTurso([{
            sql: "DELETE FROM classes WHERE id = ? AND group_name = ?",
            args: [
              { type: "text", value: classId },
              { type: "text", value: currentGroup }
            ]
          }]);

          setSchedule(prev => prev.filter(c => c.id !== classId));
          if (modalClass && modalClass.id === classId) {
            setModalClass(null);
          }
        } catch (err) {
          alert("Błąd usuwania z bazy: " + err.message);
        } finally {
          setLoading(false);
          setStatusMsg("");
        }
      };

      // -----------------------------------------------------------------------
      // MODALE
      // -----------------------------------------------------------------------
      const openAddModal = () => {
        setIsNewClass(true);
        setModalClass({
          id: "c_" + crypto.randomUUID(),
          weekRange: selectedWeek || (sortedWeeks[0] || "05.10-11.10"),
          dayName: "Poniedziałek",
          date: "05.10",
          time: "16:00 - 18:15",
          type: "lab",
          title: "",
          room: "",
          teacher: "",
          notes: "",
          meetingLink: ""
        });
      };

      const openEditModal = (cls) => {
        setIsNewClass(false);
        setModalClass({ ...cls });
      };

      // -----------------------------------------------------------------------
      // AUTO-ODBLOKOWANIE Z SESJI
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (password) unlockAndFetch(password);
        // eslint-disable-next-line
      }, []);

      // -----------------------------------------------------------------------
      // EKRAN LOGOWANIA
      // -----------------------------------------------------------------------
      if (!isUnlocked) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl backdrop-blur">
              <div className="text-center mb-6">
                <div className="w-14 h-14 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                  <i className="fa-solid fa-lock"></i>
                </div>
                <h2 className="text-xl font-bold tracking-tight">Plan Zajęć</h2>
                <p className="text-sm text-slate-400 mt-1.5 leading-relaxed">
                  Podaj hasło grupy, aby zdeszyfrować bazę SQLite (AES-256-GCM).
                </p>
              </div>

              <form onSubmit={(e) => { e.preventDefault(); unlockAndFetch(password); }} className="space-y-4">
                <div>
                  <input
                    type="password"
                    placeholder="Wpisz hasło grupy..."
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-400 transition"
                    required
                    autoFocus
                  />
                </div>
                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-cyan-500/20 disabled:opacity-50 flex items-center justify-center gap-2"
                >
                  {loading ? (
                    <>
                      <i className="fa-solid fa-circle-notch fa-spin"></i>
                      <span>{statusMsg || "Odblokowywanie..."}</span>
                    </>
                  ) : (
                    <>
                      <i className="fa-solid fa-key"></i>
                      <span>Odblokuj i pobierz plan</span>
                    </>
                  )}
                </button>
              </form>

              <p className="text-[11px] text-slate-500 mt-5 text-center leading-relaxed">
                Wpisz hasło swojej grupy. Grupa zostanie rozpoznana
                automatycznie na podstawie odszyfrowanych danych.
              </p>
            </div>
          </div>
        );
      }

      // -----------------------------------------------------------------------
      // FILTROWANIE I GRUPOWANIE ZAJĘĆ
      // -----------------------------------------------------------------------
      const activeWeek = selectedWeek || sortedWeeks[0] || "";
      const filteredClasses = schedule
        .filter(c => c.weekRange === activeWeek)
        .sort((a, b) => {
          const dayDiff = (DAY_ORDER[a.dayName] || 99) - (DAY_ORDER[b.dayName] || 99);
          if (dayDiff !== 0) return dayDiff;
          return a.time.localeCompare(b.time);
        });

      const groupedByDay = filteredClasses.reduce((acc, curr) => {
        const key = `${curr.dayName} (${curr.date})`;
        if (!acc[key]) acc[key] = [];
        acc[key].push(curr);
        return acc;
      }, {});

      const headerTitle = groupTitle(currentGroup);
      const headerLabel = currentGroup || "—";

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          <header className="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-8 border-b border-slate-800 gap-4">
            <div>
              <div className="flex items-center gap-3 flex-wrap">
                <h1 className="text-2xl md:text-3xl font-extrabold text-white tracking-tight">
                  {headerTitle}
                </h1>
                <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-3 py-1 rounded-full font-mono flex items-center gap-1.5">
                  <i className="fa-solid fa-database"></i> Turso SQLite + E2EE
                </span>
                <span className="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-xs px-3 py-1 rounded-full font-mono flex items-center gap-1.5">
                  <i className="fa-solid fa-users"></i> grupa: {headerLabel}
                </span>
              </div>
              <p className="text-slate-400 text-sm mt-1">
                Plan posortowany chronologicznie • Zmiany zapisują się bezpośrednio w chmurze SQLite
              </p>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={openAddModal}
                disabled={loading}
                className="text-xs bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-lg shadow-cyan-500/20"
              >
                <i className="fa-solid fa-plus"></i> Dodaj zajęcia
              </button>
              <button
                onClick={() => unlockAndFetch(password)}
                className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-2 rounded-lg border border-slate-800 transition flex items-center gap-1.5"
                title="Odśwież dane z bazy"
              >
                <i className="fa-solid fa-rotate"></i> Odśwież
              </button>
              <button
                onClick={() => {
                  sessionStorage.removeItem("cyber_plan_pass");
                  sessionStorage.removeItem("cyber_plan_group");
                  setPassword("");
                  setCurrentGroup("");
                  setSchedule([]);
                  setSelectedWeek("");
                  setIsUnlocked(false);
                }}
                className="text-xs bg-rose-500/10 text-rose-300 border border-rose-500/20 hover:bg-rose-500/20 px-3 py-2 rounded-lg transition flex items-center gap-1.5"
              >
                <i className="fa-solid fa-lock"></i> Zablokuj
              </button>
            </div>
          </header>

          {sortedWeeks.length > 0 && (
            <div className="mb-8">
              <label className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 block">
                Wybierz tydzień (posortowane chronologicznie):
              </label>
              <div className="flex gap-2 overflow-x-auto pb-3 scrollbar-thin">
                {sortedWeeks.map((week, idx) => (
                  <button
                    key={idx}
                    onClick={() => setSelectedWeek(week)}
                    className={`px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition border ${
                      activeWeek === week
                        ? "bg-cyan-500 text-slate-950 border-cyan-400 shadow-lg shadow-cyan-500/20 font-bold"
                        : "bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800 hover:text-slate-200"
                    }`}
                  >
                    {week}
                  </button>
                ))}
              </div>
            </div>
          )}

          <div className="space-y-6">
            {schedule.length === 0 ? (
              <div className="text-center py-16 text-slate-500 bg-slate-900/30 rounded-2xl border border-slate-800 p-6">
                <i className="fa-regular fa-calendar-xmark text-4xl mb-3 text-slate-600"></i>
                <p className="text-base font-medium text-slate-300 mb-2">Baza jest pusta</p>
                <p className="text-xs text-slate-500 mb-5">Nie znaleziono żadnych wpisów dla grupy „{headerLabel}”.</p>
                <button
                  onClick={openAddModal}
                  className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition"
                >
                  <i className="fa-solid fa-plus mr-1.5"></i> Dodaj pierwsze zajęcia
                </button>
              </div>
            ) : Object.keys(groupedByDay).length === 0 ? (
              <div className="text-center py-12 text-slate-500 bg-slate-900/30 rounded-2xl border border-slate-800">
                Brak zajęć w wybranym tygodniu ({activeWeek}).
              </div>
            ) : (
              Object.keys(groupedByDay).map((dayTitle, idx) => (
                <div key={idx} className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 backdrop-blur">
                  <div className="flex items-center gap-2.5 border-b border-slate-800/60 pb-3 mb-4">
                    <i className="fa-regular fa-calendar text-cyan-400 text-sm"></i>
                    <span className="text-base font-bold text-slate-100">{dayTitle}</span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {groupedByDay[dayTitle].map((cls) => (
                      <div
                        key={cls.id}
                        className="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 transition shadow-sm flex flex-col justify-between"
                      >
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-2.5">
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider ${
                              cls.type === 'lab' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
                              cls.type === 'wyk' ? 'bg-sky-500/20 text-sky-300 border border-sky-500/30' :
                              'bg-purple-500/20 text-purple-300 border border-purple-500/30'
                            }`}>
                              {cls.type === 'lab' ? 'LABORATORIUM' : cls.type === 'wyk' ? 'WYKŁAD' : 'SEMINARIUM'}
                            </span>
                            <span className="text-xs font-mono text-slate-400 flex items-center gap-1.5">
                              <i className="fa-regular fa-clock text-slate-500"></i> {cls.time}
                            </span>
                          </div>

                          <h3 className="font-semibold text-slate-100 text-sm leading-snug mb-3">
                            {cls.title}
                          </h3>

                          <div className="space-y-2 text-xs">
                            <div className="flex items-start gap-2">
                              <i className="fa-solid fa-location-dot mt-0.5 text-amber-400 w-3 text-center"></i>
                              <span className="font-medium bg-amber-500/10 text-amber-300 px-2 py-0.5 rounded border border-amber-500/20">
                                {cls.room || "Brak sali"}
                              </span>
                            </div>

                            <div className="flex items-center gap-2 text-slate-400">
                              <i className="fa-solid fa-user-tie text-slate-500 w-3 text-center"></i>
                              <span>{cls.teacher || "Nie określono"}</span>
                            </div>

                            {cls.meetingLink && (
                              <div className="pt-1">
                                <a
                                  href={cls.meetingLink}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center gap-2 bg-blue-500/15 text-blue-300 hover:bg-blue-500/25 border border-blue-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition"
                                >
                                  <i className="fa-solid fa-video text-blue-400"></i>
                                  <span>Dołącz do spotkania</span>
                                  <i className="fa-solid fa-arrow-up-right-from-square text-[10px] text-blue-400 ml-0.5"></i>
                                </a>
                              </div>
                            )}

                            {cls.notes && (
                              <div className="mt-2.5 p-2 bg-slate-950/70 border border-slate-800 rounded text-slate-300 italic">
                                <i className="fa-regular fa-note-sticky mr-1.5 text-cyan-400"></i>{cls.notes}
                              </div>
                            )}
                          </div>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
                          <button
                            onClick={() => handleDelete(cls.id)}
                            className="text-xs text-rose-400 hover:text-rose-300 p-1.5 rounded hover:bg-rose-950/40 transition"
                            title="Usuń te zajęcia"
                          >
                            <i className="fa-solid fa-trash-can"></i>
                          </button>
                          <button
                            onClick={() => openEditModal(cls)}
                            className="text-xs font-medium text-cyan-400 hover:text-cyan-300 flex items-center gap-1.5 px-2.5 py-1 rounded hover:bg-cyan-950/50 transition"
                          >
                            <i className="fa-solid fa-pen-to-square"></i> Edytuj
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))
            )}
          </div>

          {modalClass && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-800">
                  <h3 className="font-bold text-lg text-slate-100">
                    {isNewClass ? `Dodaj nowe zajęcia (grupa: ${headerLabel})` : "Edycja zajęć w SQLite"}
                  </h3>
                  <button
                    onClick={() => setModalClass(null)}
                    className="text-slate-400 hover:text-slate-200">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={handleSave} className="space-y-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                      Zakres tygodnia (np. 16.11-22.11)
                    </label>
                    <input
                      type="text"
                      value={modalClass.weekRange}
                      onChange={(e) => setModalClass({ ...modalClass, weekRange: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400 text-slate-100"
                      placeholder="DD.MM-DD.MM"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Dzień tygodnia
                      </label>
                      <select
                        value={modalClass.dayName}
                        onChange={(e) => setModalClass({ ...modalClass, dayName: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400 text-slate-100"
                      >
                        <option value="Poniedziałek">Poniedziałek</option>
                        <option value="Wtorek">Wtorek</option>
                        <option value="Środa">Środa</option>
                        <option value="Czwartek">Czwartek</option>
                        <option value="Piątek">Piątek</option>
                        <option value="Sobota">Sobota</option>
                        <option value="Niedziela">Niedziela</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Data (np. 16.11)
                      </label>
                      <input
                        type="text"
                        value={modalClass.date}
                        onChange={(e) => setModalClass({ ...modalClass, date: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400 text-slate-100"
                        placeholder="DD.MM"
                        required
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                      Nazwa przedmiotu
                    </label>
                    <input
                      type="text"
                      value={modalClass.title}
                      onChange={(e) => setModalClass({ ...modalClass, title: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400 text-slate-100"
                      placeholder="np. Postincydentalna analiza laboratoryjna"
                      required
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-amber-400 uppercase tracking-wider block mb-1">
                      Sala
                    </label>
                    <input
                      type="text"
                      value={modalClass.room}
                      onChange={(e) => setModalClass({ ...modalClass, room: e.target.value })}
                      className="w-full bg-slate-950 border border-amber-500/40 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-400 text-amber-200 font-medium"
                      placeholder="np. 3072 - s.lab. 353, Rockwell-Francuska"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-blue-400 uppercase tracking-wider block mb-1">
                      <i className="fa-solid fa-video mr-1"></i> Link do spotkania online
                    </label>
                    <input
                      type="url"
                      value={modalClass.meetingLink || ""}
                      onChange={(e) => setModalClass({ ...modalClass, meetingLink: e.target.value })}
                      className="w-full bg-slate-950 border border-blue-500/40 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-400 text-blue-200 font-mono"
                      placeholder="https://zoom.us/j/... lub https://teams.microsoft.com/..."
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Godzina
                      </label>
                      <input
                        type="text"
                        value={modalClass.time}
                        onChange={(e) => setModalClass({ ...modalClass, time: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400 text-slate-100"
                        placeholder="16:00 - 18:15"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Typ zajęć
                      </label>
                      <select
                        value={modalClass.type}
                        onChange={(e) => setModalClass({ ...modalClass, type: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400 text-slate-100"
                      >
                        <option value="lab">Laboratorium</option>
                        <option value="wyk">Wykład</option>
                        <option value="sem">Seminarium</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                      Prowadzący
                    </label>
                    <input
                      type="text"
                      value={modalClass.teacher}
                      onChange={(e) => setModalClass({ ...modalClass, teacher: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400 text-slate-100"
                      placeholder="Tytuł, Imię i Nazwisko"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                      Notatki grupy
                    </label>
                    <textarea
                      rows="2"
                      value={modalClass.notes || ""}
                      onChange={(e) => setModalClass({ ...modalClass, notes: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-400 text-slate-100"
                      placeholder="np. Hasło do spotkania, kolokwium..."
                    ></textarea>
                  </div>

                  <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                    {!isNewClass ? (
                      <button
                        type="button"
                        onClick={() => handleDelete(modalClass.id)}
                        className="px-3.5 py-2 rounded-lg text-sm bg-rose-500/10 text-rose-300 hover:bg-rose-500/20 border border-rose-500/30 transition flex items-center gap-1.5"
                      >
                        <i className="fa-solid fa-trash-can"></i> Usuń
                      </button>
                    ) : <div></div>}

                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setModalClass(null)}
                        className="px-4 py-2 rounded-lg text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition"
                      >
                        Anuluj
                      </button>
                      <button
                        type="submit"
                        disabled={loading}
                        className="px-5 py-2 rounded-lg text-sm bg-cyan-500 text-slate-950 font-bold hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20 disabled:opacity-50"
                      >
                        {loading ? "Zapisywanie w SQLite..." : (isNewClass ? "Dodaj do planu" : "Zapisz zmiany")}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
